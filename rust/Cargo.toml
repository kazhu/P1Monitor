[package]
name = "p1monitor"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Reads DSMR telegrams from a P1 port via esp-link and ingests them into InfluxDB"
authors = ["Attila Zoltan Kovacs"]
repository = "https://github.com/kazhu/P1Monitor"
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
indexmap = { version = "2.14.2", features = ["serde"] }
json5 = "1.3.1"
memchr = "2.7"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5"

[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = "0.5.0"

[dev-dependencies]
criterion = "0.8.2"
rust_decimal = { version = "1.43.0", features = ["macros"] }

[[bench]]
name = "reader"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"

# `cargo deb` builds the Debian package (replaces dpkg/create_dpkg.sh of the C# version).
[package.metadata.deb]
name = "p1monitor"
maintainer = "Attila Zoltan Kovacs"
depends = "systemd"
section = "utils"
extended-description = "P1Monitor is reading data from a P1 port via esp-link remotely and ingesting into InfluxDB"
maintainer-scripts = "dpkg/"
assets = [
    ["target/release/p1monitor", "usr/lib/p1monitor/", "755"],
    ["obismappings.json", "usr/lib/p1monitor/", "644"],
    ["appsettings.json", "etc/p1monitor/", "644"],
    ["dpkg/p1monitor.service", "lib/systemd/system/", "644"],
]
conf-files = ["/etc/p1monitor/appsettings.json"]
